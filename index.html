<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にっぽんクイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d8fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>にっぽん たんけんクイズ</title>
<style>
:root{
  --blue:#2d8fd0; --blue-d:#1f6fa6; --ink:#33291f; --sub:#7a6a5c; --bg:#eaf6fd; --card:#fff;
  --ok:#2fb36a; --ng:#e8574f; --warn:#ff9f1c; --line:#d9e6ee;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
#home{overflow-y:auto;align-items:center;background:linear-gradient(#bfe6fb,#eaf6fd 40%)}
.home-in{width:min(760px,100%);padding:18px 18px 36px}
.logo{text-align:center;margin:8px 0 14px}
.logo .big{font-size:clamp(28px,6vw,46px);font-weight:900;color:var(--blue-d);letter-spacing:.04em;
  text-shadow:0 2px 0 #fff,0 0 12px #fff}
.logo .sm{font-size:14px;color:var(--sub);font-weight:700;margin-top:4px}
.logo .em{font-size:40px;letter-spacing:6px;margin-bottom:2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.mbtn{background:var(--card);border-radius:22px;padding:16px 16px 14px;text-align:left;
  box-shadow:0 5px 0 rgba(0,0,0,.08),0 8px 18px rgba(30,90,140,.12);display:flex;gap:14px;align-items:center;
  transition:transform .08s}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mbtn .ic{font-size:42px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none}
.mbtn b{display:block;font-size:19px}
.mbtn span.d{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.ic.p{background:#ffe9a8}.ic.m{background:#d9efd2}.ic.r{background:#cfe9fb}.ic.a{background:#f9d6e6}
.opts{background:var(--card);border-radius:22px;padding:14px 16px;margin-top:16px;box-shadow:0 5px 14px rgba(30,90,140,.1)}
.opts h3{margin:0 0 8px;font-size:15px;color:var(--blue-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eef3f7;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;border:2px solid transparent}
.chip.on{background:#d8efff;border-color:var(--blue);color:var(--blue-d)}
.stats{margin-top:14px;font-size:13px;color:var(--sub);text-align:center;line-height:1.7}
.foot{margin-top:10px;text-align:center;font-size:11px;color:#9a8c7e;line-height:1.6}

/* ---------- ゲーム ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.top .back{background:#eef3f7;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.top .ttl{font-weight:900;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sc{font-weight:900;font-size:15px;background:#fff4cf;border-radius:12px;padding:7px 10px;white-space:nowrap}
.top .snd{background:#eef3f7;border-radius:12px;padding:7px 10px;font-size:16px}
.gm{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{flex:none;background:#fff;margin:8px 8px 0;border-radius:18px;padding:10px 12px;
  box-shadow:0 3px 10px rgba(30,90,140,.12);max-height:44vh;overflow-y:auto}
.mapwrap{position:relative;flex:1;min-height:0;margin:8px;border-radius:18px;overflow:hidden;
  background:#d4ecfa;box-shadow:inset 0 0 0 2px #b8dcf1}
@media (orientation:landscape) and (min-width:560px){
  .gm{flex-direction:row}
  .panel{width:min(380px,40vw);max-height:none;margin:8px 0 8px 8px;overflow-y:auto}
  .mapwrap{margin:8px}
}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zb{position:absolute;right:10px;display:flex;flex-direction:column;gap:8px}
.zb button{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.95);font-size:22px;font-weight:900;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.layers{position:absolute;left:10px;top:10px;display:flex;gap:8px}
.layers button{background:rgba(255,255,255,.95);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);border:2px solid transparent}
.layers button.on{background:#d8efff;border-color:var(--blue)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(40,30,20,.88);color:#fff;
  padding:9px 16px;border-radius:999px;font-weight:800;font-size:15px;pointer-events:none;opacity:0;transition:opacity .2s;
  max-width:90%;text-align:center;z-index:3}
.toast.on{opacity:1}

.q-lab{font-size:13px;font-weight:800;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.q-main{font-size:19px;font-weight:900;margin:4px 0 6px;line-height:1.4}
.q-main small{font-size:13px;color:var(--sub);font-weight:700}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.emo .eb{display:flex;flex-direction:column;align-items:center;background:#f6fafd;border-radius:14px;padding:4px 8px;min-width:66px}
.eb b{font-size:clamp(32px,7vw,46px);font-weight:400;line-height:1.1}
.eb i{font-size:12.5px;font-style:normal;font-weight:800;color:#5a4a3c;margin-top:1px}
.modal{position:fixed;inset:0;background:rgba(30,40,50,.55);display:none;z-index:20;overflow-y:auto;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px)}
.modal.on{display:block}
.mc{max-width:760px;margin:0 auto;background:#fff;border-radius:22px;padding:14px 14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mh h2{margin:0;font-size:26px}
.mh .sub{font-size:13px;font-weight:800;color:var(--ok)}
.mmap{margin:8px 0;border-radius:16px;overflow:hidden;background:#d4ecfa}
.mmap svg{display:block;width:100%;height:auto;max-height:62vh}
.mf{display:grid;gap:8px;margin-top:6px}
.mf .row{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.5}
.mf .k{flex:none;min-width:84px;font-weight:900;font-size:13px;color:var(--blue-d);background:#e6f3fc;border-radius:8px;padding:2px 8px;text-align:center}
.mf .v{flex:1;min-width:0}
.mf .it2{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}
.mf .it2 b{font-size:22px;font-weight:400;margin-right:3px;vertical-align:-2px}
.mbtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px}
.hint{background:#fff9e3;border-left:5px solid var(--warn);border-radius:10px;padding:7px 10px;margin:6px 0;font-size:14px;line-height:1.5;
  animation:slide .25s}
.hint b{color:#c77700}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border-radius:14px;padding:11px 16px;font-weight:900;font-size:15px;background:#eef3f7;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--blue);color:#fff}
.btn.hint-b{background:#ffe19a}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.res{border-radius:14px;padding:10px 12px;margin:6px 0}
.res.good{background:#e6f7ee;border:2px solid var(--ok)}
.res.bad{background:#fdecea;border:2px solid var(--ng)}
.res h4{margin:0 0 4px;font-size:18px}
.stars{font-size:22px;letter-spacing:2px}
.facts{font-size:14px;line-height:1.55;margin-top:4px}
.facts .row{margin:2px 0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-right:4px}

/* 結果 */
#result{align-items:center;overflow-y:auto;background:linear-gradient(#ffe9a8,#eaf6fd 40%)}
.res-in{width:min(640px,100%);padding:22px 16px 40px;text-align:center}
.res-in h2{margin:6px 0;font-size:28px}
.bigstars{font-size:44px;letter-spacing:4px}
.lst{background:#fff;border-radius:18px;padding:8px 12px;margin:14px 0;text-align:left;font-size:14px}
.lst div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.lst div:last-child{border:0}

/* 地図スタイル */
.pref{stroke:#fff;stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s,opacity .25s;cursor:pointer}
.pref.un{fill:#f7fafc;stroke:#8fa3b1;stroke-width:1px}
.pref.oki{stroke:#6aa9d0;stroke-dasharray:5 3}
.pref.oki.un{fill:#e4f1f9}
#gScore:empty{display:none}
.pref.hl{stroke:#ff8a00;stroke-width:3px}
.pref.dim{opacity:.55}
.pref.pop{animation:pop .5s}
.pref.flash{animation:flash .7s}
@keyframes pop{0%{filter:brightness(1.4)}100%{filter:none}}
@keyframes flash{0%,60%{fill:#ff8f87}}
.lbl{font-weight:900;fill:#3b2f2a;text-anchor:middle;dominant-baseline:central;pointer-events:none;
  paint-order:stroke;stroke:#fff;stroke-width:.7;stroke-linejoin:round}
.rv{fill:none;stroke:#3aa0e8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rvhit{fill:none;stroke:transparent;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.rv.big{stroke:#0b6fd1}
.rvname,.mtname{font-weight:800;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.6;stroke-linejoin:round;
  text-anchor:middle;dominant-baseline:central;display:none}
.rvname{fill:#0b6fd1}.mtname{fill:#8a4b16}
svg.z2 .rvname,svg.z2 .mtname{display:block}
.mt{cursor:pointer}
.mtmark{fill:#b45a24;stroke:#fff;stroke-width:.35}
.mtmark.big{fill:#e0382e}
.ans-line{stroke:#e8574f;stroke-width:1.2;stroke-dasharray:2 1.5;vector-effect:non-scaling-stroke}
.pulse{animation:pls 1s infinite}
@keyframes pls{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.tapmark{pointer-events:none}
.oki-frame{fill:#cfe9f8;stroke:#7ab5d9;stroke-width:.7;stroke-dasharray:2 1.2}
.oki-note{font-size:2.4px;fill:#5a7a8c;text-anchor:middle;pointer-events:none;font-weight:700}
</style>
</head>
<body>

<!-- ホーム -->
<section id="home" class="screen on">
 <div class="home-in">
  <div class="logo"><div class="em">🗾🗻🌊</div><div class="big">にっぽん たんけんクイズ</div>
   <div class="sm">ヒントをよんで、地図をタッチ！ 都道府県・山・川をおぼえよう</div></div>
  <div class="menu">
   <button class="mbtn" data-mode="pref"><div class="ic p">📍</div><div><b>都道府県クイズ</b><span class="d">イラストのヒントから、どこの都道府県かあててタッチ！</span></div></button>
   <button class="mbtn" data-mode="mt"><div class="ic m">⛰️</div><div><b>山クイズ</b><span class="d">日本の有名な山はどこ？ 場所をタッチしてこたえよう</span></div></button>
   <button class="mbtn" data-mode="river"><div class="ic r">🌊</div><div><b>川クイズ</b><span class="d">日本の有名な川はどこを流れてる？ 川をタッチ！</span></div></button>
   <button class="mbtn" data-mode="atlas"><div class="ic a">📖</div><div><b>日本地図ずかん</b><span class="d">都道府県・山・川をタッチして調べよう</span></div></button>
  </div>
  <div class="opts">
   <h3>🎯 都道府県クイズの出題</h3>
   <div class="chips" id="regChips"></div>
  </div>
  <div class="opts">
   <h3>🔢 1回の問題数</h3>
   <div class="chips" id="cntChips"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="foot">ホーム画面に追加すると、アプリのように使えます（Safari の共有ボタン →「ホーム画面に追加」）。<br>
   川の線や山の位置はおおまかな目安です。</div>
 </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen">
 <div class="top">
  <button class="back" id="btnBack">◀ もどる</button>
  <div class="ttl" id="gTitle"></div>
  <div class="sc" id="gScore">⭐0</div>
  <button class="snd" id="btnSnd">🔊</button>
 </div>
 <div class="gm">
  <div class="panel" id="panel"></div>
  <div class="mapwrap" id="mapwrap">
   <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
   <div class="layers" id="layers"></div>
   <div class="zb"><button id="zIn">＋</button><button id="zOut">－</button><button id="zHome">⌂</button></div>
   <div class="toast" id="toast"></div>
  </div>
 </div>
</section>

<div class="modal" id="cardModal"><div class="mc" id="mcBody"></div></div>

<!-- 結果 -->
<section id="result" class="screen">
 <div class="res-in" id="resIn"></div>
</section>

function setVB(){

// 拡大しても文字・マーカーの画面上の大きさをほぼ一定にする(県境を隠さない)
function updateScaling(){
  const k=ppu(); if(!k||!(k>0.05)) return;
  for(const id in lblEl){
    const t=lblEl[id], o=+t.dataset.fs, f=Math.min(o,11.5/k);
    t.setAttribute("font-size",f.toFixed(2)); t.style.strokeWidth=(f*0.22).toFixed(2);
    t.style.display=(f*k<4.6)?"none":"";
  }
  const fz=(10.5/k).toFixed(2);
  for(const i in mtEls){
    const g=mtEls[i], x=+g.dataset.x, y=+g.dataset.y;
    const sc=Math.max(.2,Math.min(1.6,9/k/3.6));
    g.querySelector(".mtmark").setAttribute("transform",`translate(${x} ${y}) scale(${sc.toFixed(3)}) translate(${-x} ${-y})`);
    const h=g.querySelector(".mthit"); h.setAttribute("r",Math.min(5,13/k).toFixed(2));
    const t=g.querySelector("text"); t.setAttribute("font-size",fz); t.setAttribute("y",(y+7.5/k).toFixed(2)); t.style.strokeWidth=(10.5/k*.2).toFixed(2);
  }
  for(const i in rvEls){
    const t=rvEls[i].querySelector(".rvname"), x=+t.dataset.x, y=+t.dataset.y;
    t.setAttribute("font-size",fz); t.setAttribute("x",(x+5/k).toFixed(2)); t.setAttribute("y",(y-4/k).toFixed(2)); t.style.strokeWidth=(10.5/k*.2).toFixed(2);
  }
}
function clampVB(){
  const mw=FULL.w*.15, mh=FULL.h*.15;
  vb.x=Math.min(Math.max(vb.x,FULL.x-mw),FULL.x+FULL.w+mw-vb.w);
  vb.y=Math.min(Math.max(vb.y,FULL.y-mh),FULL.y+FULL.h+mh-vb.h);
}
function ppu(){ const m=svg.getScreenCTM(); return m?m.a:1; }
function clientToSvg(cx,cy){
  const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; const m=svg.getScreenCTM().inverse(); const p=pt.matrixTransform(m); return [p.x,p.y];
}
function zoomAt(f,cx,cy){ // cx,cy: svg座標
  const nw=Math.min(FULL.w,Math.max(FULL.w/9,vb.w/f)), r=nw/vb.w;
  vb.x=cx-(cx-vb.x)*r; vb.y=cy-(cy-vb.y)*r; vb.w=nw; vb.h=nw*FULL.h/FULL.w; clampVB(); setVB();
}
function resetView(){ vb={...FULL}; setVB(); }
function zoomTo(x,y,z){ vb.w=FULL.w/z; vb.h=FULL.h/z; vb.x=x-vb.w/2; vb.y=y-vb.h/2; clampVB(); setVB(); }

// ポインタ操作 (ドラッグ=移動、ピンチ=拡大縮小、タップ=回答)
const ptrs=new Map(); let tapInfo=null, lastPinch=null;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) tapInfo={x:e.clientX,y:e.clientY,t:Date.now(),moved:false,multi:false};
  else { if(tapInfo) tapInfo.multi=true; lastPinch=null; }
});
svg.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(ptrs.size===1){
    if(tapInfo && !tapInfo.moved && Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8) tapInfo.moved=true;
    if(tapInfo && tapInfo.moved){
      const k=ppu(); vb.x-=dx/k; vb.y-=dy/k; clampVB(); setVB();
    }
  } else if(ptrs.size>=2){
    const a=[...ptrs.values()];
    p.x=e.clientX; p.y=e.clientY;
    const [p1,p2]=[a[0],a[1]];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y), mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    if(lastPinch){
      const k=ppu();
      vb.x-=(mx-lastPinch.mx)/k; vb.y-=(my-lastPinch.my)/k;
      const [sx,sy]=clientToSvg(mx,my);
      if(lastPinch.d>0) zoomAt(d/lastPinch.d,sx,sy); else {clampVB();setVB();}
    }
    lastPinch={d,mx,my}; return;
  }
  p.x=e.clientX; p.y=e.clientY;
});
function endPtr(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId);
  if(!had) return;
  if(ptrs.size<2) lastPinch=null;
  if(ptrs.size===0 && tapInfo){
    const ti=tapInfo; tapInfo=null;
    if(e.type==="pointerup" && !ti.moved && !ti.multi && Date.now()-ti.t<800){
      const [sx,sy]=clientToSvg(e.clientX,e.clientY);
      curEls=document.elementsFromPoint(e.clientX,e.clientY);
      onTap(sx,sy,curEls[0]);
    }
  }
}
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{ e.preventDefault(); const [sx,sy]=clientToSvg(e.clientX,e.clientY); zoomAt(e.deltaY<0?1.2:1/1.2,sx,sy); },{passive:false});

/* ===================== 川クイズ ===================== */
function distSeg(px,py,a,b){
  const vx=b[0]-a[0], vy=b[1]-a[1], wx=px-a[0], wy=py-a[1];
  const t=Math.max(0,Math.min(1,(vx*wx+vy*wy)/(vx*vx+vy*vy||1)));
  return Math.hypot(px-(a[0]+t*vx),py-(a[1]+t*vy));
}
function distRiver(r,x,y){ let m=1e9; for(let k=0;k<r.pts.length-1;k++) m=Math.min(m,distSeg(x,y,r.pts[k],r.pts[k+1])); return m; }
function askRiver(){
  const i=Q.list[Q.i], r=RIVERS[i];
  const regs=[...new Set(r[3].map(id=>P[id].region))];
  const hints=[
    {html:()=>`<b>長さ：</b>${r[2]}km`},
    {html:()=>`<b>せつめい：</b>${r[5].replace(r[0],"この川")}`},
    {html:()=>`<b>地方：</b>${regs.join("・")}（色つきの場所のどこか）`, apply:()=>highlightPrefs(regs.flatMap(x=>regionIds[x]),true)},
    {html:()=>`<b>流れる県：</b>${r[3].map(id=>P[id].name).join("・")}　<b>そそぐ海：</b>${r[6]}`, apply:()=>highlightPrefs(r[3],true)},
  ];
  $("#panel").innerHTML=`<div class="q-lab"><span>${Q.i+1} / ${Q.list.length}</span><span>川をさがそう</span></div>
   <div class="q-main">${r[4]} <ruby>${r[0]}<rt>${r[1]}</rt></ruby> <small>はどこを流れてる？ 川の上をタッチ👆</small></div>
   <div id="hintBox"></div>
   <div class="btns"><button class="btn hint-b" id="btnHint">💡ヒント</button><button class="btn" id="btnSkip">わからない</button></div>`;

  tapHandler=(x,y)=>{
    if(Q.done) return;
    const k=ppu(); const tol=Math.min(8,Math.max(3,22/k));

  };
}
function revealRiver(i,tap){

  const T=([x,y])=>[x*sc+ox,y*sc+oy];
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  o+=`<rect width="${W}" height="${H}" fill="#d4ecfa"/>`;

     lab(capN.x,capN.y-30,d.cap,19,"#b3261e",5);

  $("#cardModal").classList.add("on"); $("#cardModal").scrollTop=0;
  $("#mcClose").onclick=closeCard;
  if(opts.next) $("#mcNext").onclick=()=>{ closeCard(); opts.next(); };
}
$("#cardModal").addEventListener("pointerdown",e=>{ if(e.target.id==="cardModal") closeCard(); });

/* ===================== 起動 ===================== */
buildMap();
renderHome();
// ダブルタップ拡大などの既定動作を抑止
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
</script>
</body>
